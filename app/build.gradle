plugins {
    id 'com.android.application'
}

android {
    namespace 'com.gloireadieu'
    compileSdk 34

    defaultConfig {
        applicationId "com.gloireadieu"
        minSdk 21
        targetSdk 34
        versionCode 5
        versionName "2.3"
    }

    // Signature fixe (même clé à chaque compilation) : les mises à jour s'installent par-dessus.
    signingConfigs {
        fixe {
            storeFile file("gloire.keystore")
            storePassword "gloireadieu"
            keyAlias "gloire"
            keyPassword "gloireadieu"
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.fixe
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.fixe
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
}

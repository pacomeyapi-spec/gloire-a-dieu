name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Locate Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-$ANDROID_SDK_ROOT}" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-$ANDROID_HOME}" >> $GITHUB_ENV
          ls "${ANDROID_HOME:-$ANDROID_SDK_ROOT}"

      - name: Accept SDK licences
        run: yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true

      - name: Check assets
        run: |
          echo "Assets: $(ls app/src/main/assets | wc -l) files"
          test -f app/src/main/assets/index.html

      - name: Build Debug APK
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Assemble
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Gloire-a-Dieu-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      # Lien public stable vers la dernière version (utilisé par Yapson AppStore) :
      # https://github.com/pacomeyapi-spec/gloire-a-dieu/releases/latest/download/GloireADieu.apk
      - name: Renommer l'APK
        run: cp app/build/outputs/apk/debug/app-debug.apk GloireADieu.apk

      - name: Publier la dernière version
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.3.${{ github.run_number }}
          name: Gloire à Dieu 2.3.${{ github.run_number }}
          make_latest: true
          body: Recueil de 885 chants chrétiens, 100 % hors ligne. Télécharge GloireADieu.apk et installe-le sur Android.
          files: GloireADieu.apk
